services:
  bisheng-ft:
    build:
      dockerfile: ./docker/docker-npu/Dockerfile
      context: ../..
      args:
        INSTALL_DEEPSPEED: true
        PIP_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: bisheng-ft
    volumes:
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /etc/ascend_install.info:/etc/ascend_install.info
      - ../../data:/app/data
      - ../../output:/app/output
      - ../config/config_ft.yaml:/opt/bisheng-ft/sft_server/config.yaml  # 服务启动所需的配置文件地址
      - ../../data/llm:/opt/bisheng-ft/models/model_repository # 配置和RT服务同样的大模型目录
    ports:
      - "8000:8000"
    ipc: host
    tty: true
    stdin_open: true
    command: bash ./start-sft-server.sh
    devices:
      - /dev/davinci0
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
    restart: unless-stopped
