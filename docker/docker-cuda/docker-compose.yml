services:
  bisheng-ft:
    build:
      dockerfile: ./docker/docker-cuda/Dockerfile
      context: ../..
      args:
        INSTALL_BNB: false
        INSTALL_VLLM: false
        INSTALL_DEEPSPEED: true
        INSTALL_FLASHATTN: false
        INSTALL_LIGER_KERNEL: false
        INSTALL_HQQ: false
        INSTALL_EETQ: false
        PIP_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
    image: bisheng-ft:latest
    shm_size: "4g"
    container_name: bisheng-ft
    volumes:
      - ../../data/finetune_output:/opt/bisheng-ft/finetune_output # 训练期间的输出的模型和训练日志目录
      - ../../data/llm:/opt/bisheng-ft/models/model_repository # 配置和RT服务同样的大模型目录
      - ../config/config_ft.yaml:/opt/bisheng-ft/sft_server/config.yaml  # 服务启动所需的配置文件地址
    ports:
      - "8000:8000"
    ipc: host
    tty: true
    stdin_open: true
    command: bash ./start-sft-server.sh
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      start_period: 30s
      interval: 90s
      timeout: 30s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [ gpu ]
    restart: unless-stopped
